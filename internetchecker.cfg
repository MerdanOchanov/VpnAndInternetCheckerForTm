# InternetChecker config
# providerTargets: узлы туркменского провайдера (через запятую) для проверки МИМО VPN.
#   Проверяется через физический канал (обход VPN) с DNS, привязанным к физ. адаптеру.
#   OK, если доступен хотя бы один из узлов.
providerTargets=astu.tm,telecom.tm
# vpnTargets: популярные ресурсы для проверки ЧЕРЕЗ VPN (через запятую).
# Проверяются реальным HTTPS-запросом: сайт доступен, даже если DNS ведёт на 127.0.0.1
# (локальный редиректор/прокси туннелирует его) — это НЕ считается блокировкой.
vpnTargets=youtube.com,instagram.com,tiktok.com
# интервал авто-проверки, сек
intervalSec=15
# таймаут одной проверки, мс
timeoutMs=3000
# признаки VPN-адаптеров (через запятую) для OpenVPN/WireGuard/sing-box и т.п.
vpnHints=TAP,WireGuard,Wintun,OpenVPN,VPN,NordLynx,Mullvad,ProtonVPN,tun,utun,ppp,Clash,sing-box,singbox,v2ray,xray,outline,warp,hysteria,tun2socks,hiddify,nekoray
# локальные порты прокси (v2ray/xray/clash), если системный прокси не задан
proxyProbePorts=10808,10809,1080,1081,7890,7891,2080,8889,1087
# автозапуск с Windows
autostart=false
