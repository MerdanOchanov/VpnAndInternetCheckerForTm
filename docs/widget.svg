<svg xmlns="http://www.w3.org/2000/svg" width="520" height="250" viewBox="0 0 520 250" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.18"/>
    </filter>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f4f6fb"/>
    </linearGradient>
  </defs>

  <rect width="520" height="250" fill="#0d1b2a"/>
  <!-- window -->
  <g filter="url(#sh)">
    <rect x="60" y="30" width="400" height="180" rx="12" fill="url(#bg)" stroke="#dfe4ee"/>
  </g>
  <!-- titlebar -->
  <text x="80" y="58" font-size="13" font-weight="700" fill="#1b2a3a">InternetChecker</text>
  <circle cx="432" cy="53" r="6" fill="#e5e9f0"/>
  <text x="428" y="57" font-size="10" fill="#8a97a8">×</text>

  <!-- row 1: router OK -->
  <circle cx="88" cy="92" r="7" fill="#2fbf5b"/>
  <text x="106" y="96" font-size="13" fill="#1b2a3a">Роутер / шлюз</text>
  <text x="106" y="112" font-size="10.5" fill="#7c8798">OK  172.16.2.1</text>
  <rect x="352" y="82" width="92" height="26" rx="6" fill="#eef1f7" stroke="#d7dded"/>
  <text x="398" y="99" font-size="11" fill="#39465a" text-anchor="middle">Проверить</text>

  <!-- row 2: provider OK -->
  <circle cx="88" cy="132" r="7" fill="#2fbf5b"/>
  <text x="106" y="136" font-size="13" fill="#1b2a3a">Провайдер (мимо VPN)</text>
  <text x="106" y="152" font-size="10.5" fill="#7c8798">astu.tm: OK,  telecom.tm: OK</text>
  <rect x="352" y="122" width="92" height="26" rx="6" fill="#eef1f7" stroke="#d7dded"/>
  <text x="398" y="139" font-size="11" fill="#39465a" text-anchor="middle">Проверить</text>

  <!-- row 3: vpn via proxy OK -->
  <circle cx="88" cy="172" r="7" fill="#2fbf5b"/>
  <text x="106" y="176" font-size="13" fill="#1b2a3a">Интернет через VPN</text>
  <text x="106" y="192" font-size="10.5" fill="#7c8798">youtube.com: OK  [прокси socks 127.0.0.1:10808]</text>
  <rect x="352" y="162" width="92" height="26" rx="6" fill="#eef1f7" stroke="#d7dded"/>
  <text x="398" y="179" font-size="11" fill="#39465a" text-anchor="middle">Проверить</text>

  <!-- tray icon hint -->
  <circle cx="486" cy="228" r="8" fill="#2fbf5b" stroke="#0d1b2a" stroke-width="2"/>
  <text x="150" y="232" font-size="10" fill="#6b7787">зелёный в трее — провайдер и VPN работают</text>
</svg>
